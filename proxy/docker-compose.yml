
services:
  traefik:
    container_name: traefik
    image: traefik:v3.1
    ports:
      - 80:80
      - 443:443
    networks:
      - proxy
      - socket
    environment:
      - TZ=${TZ}
    volumes:
      - ./traefik/logs:/var/log/traefik
      - ./dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
      - /etc/letsencrypt/live/${MYDOMAIN}/fullchain.pem:/etc/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/${MYDOMAIN}/privkey.pem:/etc/certs/privkey.pem:ro
      - /etc/letsencrypt/archive/${MYDOMAIN}:/etc/letsencrypt/archive/${MYDOMAIN}:ro
    command:
      - --api.dashboard=true
      - --log.level=INFO

      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      
      - --providers.file.filename=/etc/traefik/dynamic_conf.yml
      
      - --providers.docker.network=proxy
      - --providers.docker.exposedByDefault=false
      - --providers.docker.endpoint=tcp://socketproxy:2375
      
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.asDefault=true 
    labels:
      - traefik.enable=true
      - traefik.http.routers.mydashboard.rule=Host(`proxy.${MYDOMAIN}`)
      - traefik.http.routers.mydashboard.service=api@internal
      - traefik.http.routers.mydashboard.middlewares=tinyauth

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    environment:
      - COLLECTIONS=crowdsecurity/traefik,crowdsecurity/http-bad-bots,crowdsecurity/brute-force,crowdsecurity/http-cve,crowdsecurity/http-probing,crowdsecurity/http-slowloris,crowdsecurity/sshd,crowdsecurity/cockpit
      - PARSERS="crowdsecurity/geoip-enrich" 
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec
      - ./traefik/logs:/var/log/traefik:ro
      - /var/log/auth.log:/var/log/auth.log:ro  # SSH logs
      - /var/log/cockpit:/var/log/cockpit:ro    # Cockpit logs
    ports:
      - "127.0.0.1:8080:8080"  # Expose LAPI only to localhost
    networks:
      - proxy
      
  whoami:
    image: traefik/whoami
    container_name: whoami
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.${MYDOMAIN}`)"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

  whoamisecure:
    image: traefik/whoami
    container_name: whoamisecure
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoamisecure.rule=Host(`whoamisecure.${MYDOMAIN}`)"
      - "traefik.http.services.whoamisecure.loadbalancer.server.port=80"
      - "traefik.http.routers.whoamisecure.middlewares=tinyauth"
      
  socketproxy:
    image: node:lts-alpine
    networks:
      - socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat <<EOF > server.js
        const http = require('http')

        const prefixes = [
          '/v1.24/containers',
          '/v1.24/services',
          '/v1.24/version',
          '/v1.24/networks',
          '/v1.24/events',
          '/v1.24/tasks'
        ]

        const server = http.createServer((req, res) => {
            if (process.env.LOG) {
              console.log(new Date().toISOString(), req.method, req.url)
            }

            if (req.method != 'GET' || !prefixes.some(prefix => req.url.startsWith(prefix))) {
              console.log(new Date().toISOString(), 'FORBIDDEN', req.method, req.url)
              res.statusCode = 403
              res.end('Forbidden: ' + req.method + ' ' + req.url)
              return
            }

            const options = {
                socketPath: '/var/run/docker.sock',
                method: req.method,
                path: req.url,
                headers: req.headers,
            }

            const proxy = http.request(options, (targetRes) => {
                res.writeHead(targetRes.statusCode, targetRes.headers)
                targetRes.pipe(res, { end: true })
            })

            proxy.on('error', (err) => {
                console.log(new Date().toISOString(), 'Proxy error:', err)
                res.statusCode = 500
                res.end('Server error')
            })

            req.pipe(proxy, { end: true })
        })

        server.listen(2375, '0.0.0.0', () => {
            console.log('Server running on port 2375')
        })
        EOF
        node server.js
    expose:
      - 2375
    environment:
      - LOG=true

networks:
  proxy:
    name: proxy

  socket:
    name: socket
    attachable: true



