services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      #- JELLYFIN_PublishedServerUrl=http://192.168.0.5 #optional
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${MYDOMAIN}`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    volumes:
      - ./jellyfin/library:/config
      - ./jellyfin/cache:/cache
      - /storage/docker-data/series:/data/tvshows
      - /storage/docker-data/movies:/data/movies
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
