# With help from https://jellywatch.app/blog/jellyfin-full-automation-guide-radarr-sonarr-bazarr-jellyseerr-2026

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${MYDOMAIN}`)
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    volumes:
      - ./jellyfin/library:/config
      - ./jellyfin/cache:/cache
      - /storage/docker-data/series:/data/tvshows
      - /storage/docker-data/movies:/data/movies
    restart: unless-stopped
    networks:
      - proxy
      
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${MYDOMAIN}`)
      - traefik.http.services.jellyseerr.loadbalancer.server.port=5055
    volumes:
      - ./jellyseerr/config:/app/config
    restart: unless-stopped
    networks:
      - proxy
      
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${MYDOMAIN}`)
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    volumes:
      - ./radarr/config:/config
      - /storage/docker-data/movies:/movies
      - /storage/docker-data/downloads:/downloads
    restart: unless-stopped
    networks:
      - proxy
    
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${MYDOMAIN}`)
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    volumes:
      - ./sonarr/config:/config
      - /storage/docker-data/series:/tv
      - /storage/docker-data/downloads:/downloads
    restart: unless-stopped
    networks:
      - proxy
      
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${MYDOMAIN}`)
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped
    networks:
      - proxy
      
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
      - TZ=${TZ}
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${MYDOMAIN}`)
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
    volumes:
      - ./qbittorrent/config:/config
      - /storage/docker-data/downloads:/downloads
    restart: unless-stopped
    networks:
      - proxy
      
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.${MYDOMAIN}`)
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
    volumes:
      - ./bazarr/config:/config
      - /storage/docker-data/movies:/movies
      - /storage/docker-data/series:/tv
    restart: unless-stopped
    networks:
      - proxy

  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    labels:
      - traefik.enable=true
      - traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.${MYDOMAIN}`)
      - traefik.http.services.flaresolverr.loadbalancer.server.port=8191
    volumes:
      - ./flaresolver:/config
    restart: unless-stopped
    networks:
      - proxy
      
networks:
  proxy:
    external: true
