services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    environment:
      LAPI_LISTEN_ADDR: 0.0.0.0
      TRUSTED_IPS: 172.19.0.1
      COLLECTIONS: >-
        crowdsecurity/traefik
        crowdsecurity/http-cve
        crowdsecurity/sshd
        crowdsecurity/linux
        crowdsecurity/nextcloud
      PARSERS: "crowdsecurity/geoip-enrich"
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data/
      - ${TRAEFIK_LOGS_DIR:-./../proxy/traefik/logs}:/var/log/traefik:ro
      - ${SSH_LOGS_DIR:-/var/log/auth.log}:/var/log/auth.log:ro
    ports:
      - "8080:8080"  # Expose LAPI to host
      
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "1000:1000" 
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${MYDOMAIN}`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    environment:
      #- GF_SECURITY_ADMIN_USER=gadmin
      #- GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=crowdsec-app 
    volumes:
      - ./grafana/data:/var/lib/grafana
    networks:
      - proxy
    
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./suricata/logs:/var/log/suricata
      - ./suricata/rules:/var/lib/suricata
      - ./suricata/config:/etc/suricata
      - ${TRAEFIK_LOGS_DIR:-./../proxy/traefik/logs}:/var/log/traefik:ro
      - ${SSH_LOGS_DIR:-/var/log/auth.log}:/var/log/auth.log:ro
    restart: unless-stopped
    command: -i ${MONITOR_IFACE:-enp4s0}

networks:
  proxy:
    external: true
